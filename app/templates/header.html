<header class="instagram-header">
    <div class="header-content">
        <div class="logo">
            <a href="{{ url_for('main.home') }}">NOXCO</a>
        </div>

        <div class="search-bar">
            <form action="{{ url_for('main.search_users') }}" method="GET" class="search-form">
                <i class="fas fa-search"></i>
                <input type="text" name="query" placeholder="Zoeken" value="{{ request.args.get('query', '') }}">
                <button type="submit" style="display: none;">Zoeken</button>
            </form>
        </div>

        <nav class="main-nav">
            <ul>

                {% if current_user.is_authenticated %}
                    <li>
                        <a href="{{ url_for('main.upload_model') }}" title="Upload model">💾</a>
                    </li>
                {% endif %}

                {% if current_user.is_authenticated %}
                    <li class="profile-icon">
                        <a href="{{ url_for('main.profile') }}">
                            {% if current_user.profile_picture_url %}
                                <img src="{{ current_user.profile_picture_url }}" alt="Profile Picture" class="nav-profile-pic">
                            {% else %}
                                <img src="https://via.placeholder.com/32?text=?" alt="Default Profile Pic" class="nav-profile-pic">
                            {% endif %}
                        </a>
                    </li>
                    <li>
                        <a href="{{ url_for('auth.logout') }}" class="logout-link">Uitloggen</a>
                    </li>
                {% else %}
                    <li>
                        <a href="{{ url_for('auth.login') }}" class="login-link">Inloggen</a>
                    </li>
                {% endif %}
            </ul>
        </nav>
    </div>
</header>
